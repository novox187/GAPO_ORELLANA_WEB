<!doctype html>
<html lang="es-EC">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />

		<!--
			Identidad del sitio en el navegador y en la pantalla de inicio.
			El favicon es SVG (escala sin pixelarse y sigue el tema); los PNG
			existen porque Android e iOS no aceptan SVG para el icono de la
			aplicación instalada. Se regeneran desde el mismo favicon.svg —
			ver README, "Iconos y tarjetas de previsualización".
		-->
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
		<link rel="icon" href="%sveltekit.assets%/icono-192.png" sizes="192x192" type="image/png" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/apple-touch-icon.png" sizes="180x180" />
		<link rel="manifest" href="%sveltekit.assets%/site.webmanifest" />

		<!--
			La barra del navegador móvil toma el verde de marca en claro y la
			superficie oscura del sitio en oscuro. Un solo theme-color pintaba
			una franja verde encima de una página negra.
		-->
		<meta name="theme-color" content="#0c843a" media="(prefers-color-scheme: light)" />
		<meta name="theme-color" content="#12130f" media="(prefers-color-scheme: dark)" />
		<meta name="color-scheme" content="light dark" />
		<meta name="apple-mobile-web-app-title" content="Orellana" />

		<!-- El feed de noticias, para lectores y agregadores. -->
		<link
			rel="alternate"
			type="application/rss+xml"
			title="Noticias — Alcaldía de Francisco de Orellana"
			href="%sveltekit.assets%/noticias/feed.xml"
		/>

		<script>
			// Restaura el tema elegido antes del primer pintado. Sin esto, quien
			// prefiere el modo claro con el sistema en oscuro (o al revés) ve un
			// parpadeo del tema equivocado en cada carga.
			try {
				var t = localStorage.getItem('tema');
				if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
			} catch (e) {
				/* almacenamiento bloqueado: se usa la preferencia del sistema */
			}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
